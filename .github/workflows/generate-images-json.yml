name: Generate Images JSON

on:
  push:
    branches:
      - main # Название вашей главной ветки (main или master)
    paths:
      - 'images1/**' # Запуск скрипта только при изменениях в папке images
      - 'images2/**' 
      - 'images3/**'
      - 'images4/**' 
      - 'generate-images.js'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем актуальный код репозитория
    - name: Checkout repository
      uses: actions/checkout@v4      
   
    - name: Install dependencies
      run: npm install image-size

    # 2. Запускаем Node.js скрипт для сканирования папки и сборки JSON
    - name: Generate JSON
      run: node generate-images.js
    # 3. Сохраняем созданный images.json обратно в репозиторий
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add images.json
        git diff-index --quiet HEAD || git commit -m "Автогенерация images.json [skip ci] + minify"
        git push
      

    - name: Install HTML Minifier
      run: npm install -g html-minifier-terser

    - name: Minify index.html (JS & CSS inside)
      run: |
          html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --minify-js true \
            --minify-css true \
            -o index.html index.html

    - name: Deploy to GitHub Pages 🚀
      uses: JamesIves/github-pages-deploy-action@v4
      with:
          folder: .
          branch: gh-pages

