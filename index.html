#viewer {

}

    opacity: 1;
    visibility: visible; 
    pointer-events: auto;
}

<script>

  // фвто загрузка картинок
  fetch("images.json")
    .then(res => res.json())
    .then(images => {

        const grid = document.getElementById("grid");

        images.forEach((item, index) => {

            const card = document.createElement("div");
            card.classList.add("card");
            //card.tabIndex = 0;
          
            card.dataset.image = item.url;

            // Пример шаблона размеров
           if (item.type) {
              card.classList.add(item.type);
              }

            const image = document.createElement("div");
            image.className = "card-image";
            //image.style.backgroundImage = `url("${item.url}")`;
            image.style.aspectRatio = `${item.width} / ${item.height}`;

           //card.style.aspectRatio = `${item.width} / ${item.height}`;
            card.dataset.ratio = `${item.width} / ${item.height}`;
          

            card.appendChild(image);
          
 
            grid.appendChild(card);
            observer.observe(card);
        });
    });

// предзагрузчик в видимую область
  const observer = new IntersectionObserver(entries => {

    entries.forEach(entry => {

        if (!entry.isIntersecting) return;

        const card = entry.target;
        const image = card.querySelector(".card-image");

        const src = card.dataset.image;

        const loader = new Image();

        loader.onload = () => {

            image.style.backgroundImage = `url("${src}")`;

            requestAnimationFrame(() => {
                image.classList.add("loaded");
            });

        };

        loader.src = src;

        observer.unobserve(card);

    });

}, {
    rootMargin: "300px"
});
  

  // лайтбокс
  document.addEventListener("click", e => {

    const card = e.target.closest(".card");
    if (!card) return;

    openViewer(card.dataset.image, card.dataset.ratio);

});

  //обработчик лайтбокса
  const viewer = document.getElementById("viewer");
const viewerImage = document.getElementById("viewerImage");

  document.documentElement.classList.add("no-scroll");
 // const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
  //document.body.style.paddingRight = scrollbarWidth + "px";
  
  viewerImage.style.backgroundImage = `url("${src}")`;
  viewerImage.style.aspectRatio = aspect;

  
    //viewerImage.src = src;
  //viewerImage.getBoundingClientRect();
    viewer.classList.add("open");
   

 requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            //viewer.classList.add("open");
            //document.body.classList.add("no-scroll");
        });
    });

   // Сбросить состояние
    viewerImage.classList.remove("animate");
  //viewerImage.offsetHeight;

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            viewerImage.classList.add("animate");
        });
    });
  
}

}

const menu = document.getElementById("menu");
const items = document.querySelectorAll(".item");
  const header = document.querySelector(".header");

let isOpen = false;

  
items.forEach(item => {
  item.addEventListener("click", (e) => {
    e.stopPropagation();

    // убрать active у всех
    items.forEach(i => i.classList.remove("active"));

    item.classList.add("active");

    // section1 hide + section2 show
    //
    
  });

// ======================
// DRAG + SAFE BOUNDS
// ======================
let isDragging = false;
let dragged = false;

let startX, startY;
let offsetX = 50, offsetY = 50;

const DRAG_THRESHOLD = 1;

function clampPosition(x, y) {
  const rect = menu.getBoundingClientRect();

  const maxX = window.innerWidth - rect.width;
  const maxY = window.innerHeight - rect.height;

  return {
    x: Math.max(0, Math.min(x, maxX)),
    y: Math.max(0, Math.min(y, maxY))
  };
}

header.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  isDragging = true;
  dragged = false;
  
  menu.classList.add("dragging");

header.style.cursor = "grabbing";
  
  startX = e.clientX - offsetX;
  startY = e.clientY - offsetY;

  header.setPointerCapture(e.pointerId);
});

header.addEventListener("pointermove", (e) => {
  if (!isDragging) return;

  let x = e.clientX - startX;
  let y = e.clientY - startY;

  const clamped = clampPosition(x, y);

  if (Math.abs(clamped.x - offsetX) > DRAG_THRESHOLD ||
      Math.abs(clamped.y - offsetY) > DRAG_THRESHOLD) {
    dragged = true;
  }

  offsetX = clamped.x;
  offsetY = clamped.y;

  menu.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
});

header.addEventListener("pointerup", (e) => {
  isDragging = false;

  menu.classList.remove("dragging");
   header.style.cursor = "grab";
  header.releasePointerCapture(e.pointerId);

  

  if (dragged) return;
  
// 👉 если открываем
    if (!isOpen) {
    const submenuHeight = menu.querySelector(".submenu").scrollHeight;
    const rect = menu.getBoundingClientRect();

    let newY = offsetY;

    const futureBottom = rect.bottom + submenuHeight;

    if (futureBottom > window.innerHeight) {
      newY -= (futureBottom - window.innerHeight);
    }

    newY = Math.max(0, newY);

    offsetY = newY;

    menu.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
  }

  // toggle меню только если это не drag
  isOpen = !isOpen;
  menu.classList.toggle("open", isOpen);
  
  header.style.opacity = 0.9;
setTimeout(() => {
// header.textContent = isOpen ? "MENU ⏶" : "MENU ⏷";
  header.style.opacity = 1;
}, 150);
 // header.textContent = isOpen ? "MENU ⏶" : "MENU ⏷";

  // 🟡 после изменения размера — проверяем границы заново

});


  header.addEventListener("pointercancel", () => {
  isDragging = false;
  header.style.cursor = "grab";
});

// при изменении размера окна — тоже держим внутри
window.addEventListener("resize", () => {
  const clamped = clampPosition(offsetX, offsetY);
  offsetX = clamped.x;
  offsetY = clamped.y;
  menu.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
});
</script>
