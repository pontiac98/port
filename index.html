body::before,
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-repeat: repeat;
  pointer-events: none;
}

  /* Первый GIF-слой */
body::before {
  z-index: 2000; /* Выше любого стандартного лайтбокса */
  background-image: image-set(url('o1.gif') 1x, url('o1.gif') 2x, url('o1.gif') 3x);
  background-image: -webkit-image-set(url('o1.gif') 1x, url('o1.gif') 2x, url('o1.gif') 3x);
  opacity: 0.08;
  mix-blend-mode: overlay; 
}

/* Второй GIF-слой */
body::after {
  z-index: 2001; /* Самый верхний уровень на всей странице */
  background-image: image-set(url('o2.gif') 1x, url('o2.gif') 2x, url('o2.gif') 3x);
  background-image: -webkit-image-set(url('o2.gif') 1x, url('o2.gif') 2x, url('o2.gif') 3x);

  /*mix-blend-mode: overlay; */
}

}


    
/* карточки*/
  
  .card-image {
    width: 100%; 
    height: 100%;

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    
    opacity: 0;
    transition: 
          opacity .55s ease,
          transform .35s ease, 
          filter .55s ease;
}

.card:hover .card-image {
}


  .card-image.loaded {
    opacity: 1;
}

  /* Эффекты только на устройствах с мышью hover */
@media (hover: hover) and (pointer: fine) {

  body.no-scroll .card:hover .card-image {
}

    body.no-scroll .card:hover{
      filter: saturate(1.0) ; 
}

      body.no-scroll .card:hover::after{
      opacity: .0; 
}

  .card::after{
   content: "";
   position: absolute; 
   inset: 0; 
  background-color: white;
  opacity: .0;
  pointer-events: none; 
   transition:   opacity .3s ease; 
}  

.card:has(.card-image.loaded):hover::after {
  opacity: .355;
}
  /*
  .card:hover::after {
  opacity: .355;
}
  */
  
    .card:hover{
    filter: saturate(1.0); 
}

  .card {
    filter: saturate(.5); 
  }

    .card-image {
      transform: scale(1.00);
    }

    .card:hover .card-image {
        transform: scale(1.00);
        filter: none;
    }

}

/* Сенсорные устройства */
@media (hover: none) {

      .card{
    filter: none;
}
    .card:hover{
    filter: none;
}
  
    .card-image {
        transform: none;
        filter: none;
    }
}
  
.grid {
  display: grid;
  
  grid-template-columns: repeat(5, 1fr);
  grid-auto-rows: 15vw;
  grid-auto-flow: dense;
  width: 100%; 
  
  gap: 4px;

}

  /* убрано для google подобной сетки */

    grid-column: span 2;
    grid-row: span 2;
}

.wide {
    grid-column: span 2;
}

.verywide {
    grid-column: span 3;
}

.tall {
    grid-row: span 2;
}

}

 .card:focus {
  }

  }

*,
*::before,

    box-sizing: border-box;
}
  

/* лайтбокс          */
  
#viewer {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    isolation: isolate;

    z-index: 1000;

    opacity: 0;
    visibility: hidden; 
    pointer-events: none;

    backdrop-filter: blur(0px);
    transition:
        opacity .1s ease-out,
        visibility .1s ease; 
}

#viewer.open {
    backdrop-filter: blur(2px) grayscale(100%);
    opacity: 1;
    visibility: visible; 
    pointer-events: auto;
}

  #viewer::before {
    content: "";
    position: fixed;
    inset: -20px;
    z-index: -1;

    background: rgba(0,0,0,.85);
    opacity: 0;
    transition: opacity .8s ease-out .0s;
    pointer-events: none;
}

#viewer.open::before {
  content: "";
    opacity: 1;
}

  /*  test */
  #viewer.open::after {
    content: "";
    position: fixed;
    inset: -20px;
    z-index: 1;
    background: white;
    opacity: .01;
}

     transform: scale(1);

#viewerImage.pinching {

<body>
  
<div id="viewer">
    <div id="viewerFrame">
        <div id="viewerImage"></div>
    </div>
</div>
 
  <!-- 
  -->

<div class="bw">
  <header id="menu">
    <div class="menu-item active" data-gallery="1"><span>RGB</span></div>
    <div class="menu-item" data-gallery="2"><span>CMYK</span></div>
    <div class="menu-item" data-gallery="3"><span>3-D</span></div>
    <div class="menu-item" data-gallery="about"><span>ABOUT</span></div>
  </header>
</div>
  
  <main>
    <div id="content">  
        <section id="section1" class="section">
          <div class="grid" id="grid"></div>
        </section>
    </div>
  </main>
  
<script>

  // фвто загрузка картинок
  fetch("images.json")
    .then(res => res.json())
    .then(images => {

        const grid = document.getElementById("grid");

        images.forEach((item, index) => {

            const card = document.createElement("div");
            card.classList.add("card");          
            card.dataset.image = item.url;

            // Пример шаблона размеров
           if (item.type) {
              card.classList.add(item.type);
              }

            const image = document.createElement("div");
            image.className = "card-image";
            //card.dataset.ratio = `${item.width} / ${item.height}`;
            card.dataset.ratio = item.width / item.height;
          
            card.appendChild(image);          
            grid.appendChild(card);
            observer.observe(card);
        });
    });

// предзагрузчик в видимую область
  const observer = new IntersectionObserver(entries => {

    entries.forEach(entry => {

        if (!entry.isIntersecting) return;

        const card = entry.target;
        const image = card.querySelector(".card-image");

        const src = card.dataset.image;

        const loader = new Image();

        loader.onload = () => {

            image.style.backgroundImage = `url("${src}")`;

            requestAnimationFrame(() => {
                image.classList.add("loaded");
            });

        };

        loader.src = src;
        observer.unobserve(card);
    });

}, {
    rootMargin: "300px"
});
  

  // лайтбокс
  document.addEventListener("click", e => {

    const card = e.target.closest(".card");
    if (!card) return;    
    
    const image = card.querySelector(".card-image");
    if (!image.classList.contains("loaded")) return;

    openViewer(card.dataset.image, card.dataset.ratio);
});

  //обработчик лайтбокса
  const viewer = document.getElementById("viewer");
  const viewerImage = document.getElementById("viewerImage");
  const viewerFrame = document.getElementById("viewerFrame");
  
  function openViewer(src, aspect){

const vw = window.innerWidth * 0.89;
const vh = window.innerHeight * 0.89;

let w = vw;
let h = w / aspect;

if (h > vh) {
    h = vh;
    w = h * aspect;
}

viewerFrame.style.width = w + "px";
viewerFrame.style.height = h + "px";
     viewerFrame.style.aspectRatio = aspect;
    
  document.body.classList.add("no-scroll");
  document.documentElement.classList.add("no-scroll");
 
  viewerImage.style.backgroundImage = `url("${src}")`;
  viewerImage.style.aspectRatio = aspect;
  viewer.classList.add("open");
   

 requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            //viewer.classList.add("open");
            //document.body.classList.add("no-scroll");
        });
    });

   // Сбросить состояние
    viewerFrame.classList.remove("animate");

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            viewerFrame.classList.add("animate");
        });
    });
  
}

function closeViewer() {
  viewerFrame.classList.remove("animate");
  viewer.classList.remove("open");
  
  document.body.classList.remove("no-scroll");
  document.documentElement.classList.remove("no-scroll");
}


  viewer.addEventListener("click", closeViewer);

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeViewer();
    }
});

// пинч картинки в лайтбоксе

let startDistance = 0;
let currentScale = 1;

  function distance(t1, t2) {
    return Math.hypot(
        t2.clientX - t1.clientX,
        t2.clientY - t1.clientY
    );
}

  viewerFrame.addEventListener("touchstart", e => {
     alert("Frame " + e.touches.length);
}, { passive: false });
  
   viewer.addEventListener("touchstart", e => {
     alert("viewer " + e.touches.length);
}, { passive: false });

  viewerImage.addEventListener("touchstart", e => {
     alert("touchstart " + e.touches.length);
    if (e.touches.length !== 2) return;
    viewerImage.classList.add("pinching");
    startDistance = distance(e.touches[0], e.touches[1]);
}, { passive: false });

viewerImage.addEventListener("touchmove", e => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const d = distance(e.touches[0], e.touches[1]);
    currentScale = d / startDistance;
    currentScale = Math.max(.8, Math.min(3, currentScale));
    viewerImage.style.transform = `scale(${currentScale})`;
}, { passive: false });

  function resetZoom() {
    viewerImage.classList.remove("pinching");
      requestAnimationFrame(() => {
        viewerImage.style.transform = "scale(1)";
    });
}

viewerImage.addEventListener("touchend", resetZoom);
viewerImage.addEventListener("touchcancel", resetZoom);




  
  //

// переключание галереи
  document.querySelectorAll("#menu a").forEach(item => {
    item.addEventListener("click", e => {

        e.preventDefault();
        // переключение галере
      
    });
});
  
//

</script>
