<script>



  // галерея
  let gallery = [];

  // фвто загрузка картинок
  fetch("images.json")
    .then(res => res.json())
    .then(images => {

        const grid = document.getElementById("grid");

        images.forEach((item, index) => {

            const card = document.createElement("div");
            card.classList.add("card");          
            card.dataset.image = item.url;
            card.dataset.index = index;

            // Пример шаблона размеров
           if (item.type) {
              card.classList.add(item.type);
              }

            const image = document.createElement("div");
            image.className = "card-image";
            card.dataset.ratio = item.width / item.height;
          
            card.appendChild(image);          
            grid.appendChild(card);
            observer.observe(card);

           gallery.push({
                url: item.url,
                card: card
            });
        });
    });

// предзагрузчик в видимую область
  const observer = new IntersectionObserver(entries => {

    entries.forEach(entry => {

        if (!entry.isIntersecting) return;

        const card = entry.target;
        const image = card.querySelector(".card-image");

        const src = card.dataset.image;

        const loader = new Image();

        loader.onload = () => {

            image.style.backgroundImage = `url("${src}")`;

            requestAnimationFrame(() => {
                image.classList.add("loaded");
            });

        };

        loader.src = src;
        observer.unobserve(card);
    });

}, {
    rootMargin: "300px"
});
  

  // лайтбокс
  document.addEventListener("click", e => {

    const card = e.target.closest(".card");
    if (!card) return;    
    
    const image = card.querySelector(".card-image");
    if (!image.classList.contains("loaded")) return;

    //openViewer(card.dataset.image, card.dataset.ratio);
	  openViewer(card.dataset.index);
});





  
// листание картинок в лайтбоксе свайпы через слои
//
  //
  //
  //

  // слои для трансформация - картинки для преназначения
  const layerTop = document.getElementById("layerTop");
  const layerMid = document.getElementById("layerMid");
  const layerBot = document.getElementById("layerBot");

  const imageTop =  layerTop.children[0];
  const imageMid =  layerMid.children[0];
  const imageBot =  layerBot.children[0];

	const activePointers = new Map();
	let startSwipeX = 0;
	let swiping = false;		

	let progress = 0;

  
layerMid.addEventListener("pointerdown", e => {
	activePointers.set(e.pointerId, e);
	
   	if (scale > 1) return;

if (activePointers.size > 1) {
    endSwipe(e);
    return;
}
	
	if (pinchActive) {
		endSwipe(e);
    	return;
	}

	// подтверждение свайпа
	if (!swiping) swiping = true;

	layerMid.setPointerCapture(e.pointerId); //захват указателя чтобы он не терялся при выходе из окна
	
	startSwipeX = e.clientX;
	imageMid.style.transformOrigin = `center center`; // поправляем центр после пинч зума
	});



	
	// логика свайпа
	//
	//
	
	let swipeX = 0;
	let swipeFrame = false;
	
layerMid.addEventListener("pointermove", e => {
	 if (activePointers.has(e.pointerId)) {
        activePointers.set(e.pointerId, e);
    }
	
	if (scale > 1) return;
	
	//это посути аналог пинчЭктив
	if (activePointers.size > 1) {
	endSwipe(e);
    return;
	}

	if (!swiping) return;

	//проверим и уберем
	if (pinchActive) {
    	endSwipe(e);
    	return;
	}  

 	swipeX = e.clientX;

    if (!swipeFrame) {
        swipeFrame = true;

        requestAnimationFrame(() => {
            swipeFrame = false;
            updateSwipe(swipeX);
        });
    }	
	});


function updateSwipe(x) {
//отключаем анимацию только когда происходит свайп
	viewer.classList.add("swiping");
	
	
	const rF = 0.70; // фактор тяжести
	const deltaSwipeX = (x - startSwipeX) * rF;
	progress = Math.abs(x - startSwipeX) / innerWidth;

	const scaleF = .33;
	const opaF = .8;
	
	// свайп в лево
	if (deltaSwipeX < 0) {
		const scaleBot = 1 - scaleF + scaleF * progress;
		const opaBot = progress * opaF;

		//вернуть в прежнее слои из правого свайпа
		imageMid.style.opacity = `1`;	
		imageMid.style.transform = `scale(1)`;
		layerTop.style.transform = `translateX(-101%)`;	

	imageBot.style.opacity = `${opaBot}`;	
	imageBot.style.transform = `scale(${scaleBot})`;	
	layerMid.style.transform = `translateX(${deltaSwipeX}px)`;	
		
	} else if (deltaSwipeX > 0) {  //  свайп в право
		const scaleMid = 1 - scaleF * progress;
		const opaMid = (1 - progress ) * .75 + .25;
		const shiftX = (-1.2 + progress*rF)*100;

		//вернуть в прежнее слои из левого свайпа
		imageBot.style.opacity = `0`;	
		imageBot.style.transform = `scale(.5)`;	
		layerMid.style.transform = `translateX(0px)`;	

	imageMid.style.opacity = `${opaMid}`;	
	imageMid.style.transform = `scale(${scaleMid})`;
	layerTop.style.transform = `translateX(${shiftX}%)`;	
	}
}
	

	
layerMid.addEventListener("pointerup", e => {
	activePointers.delete(e.pointerId); 
   	if (scale > 1) return;
	endSwipe(e);
	});


  layerMid.addEventListener("pointercancel", e => {
	  activePointers.delete(e.pointerId); 
	  if (scale > 1) return;
    endSwipe(e);
   });

	  
	
	function endSwipe(e) {

		//вроде не нужен?
 if (e && layerMid.hasPointerCapture(e.pointerId)) {
        layerMid.releasePointerCapture(e.pointerId);
    }
		/*
if (layerMid.hasPointerCapture(e.pointerId)) {
        layerMid.releasePointerCapture(e.pointerId);
}
		  if (
        e?.pointerId !== undefined &&
        layerMid.hasPointerCapture(e.pointerId)
    ) {
        layerMid.releasePointerCapture(e.pointerId);
    }
*/
			  
	swiping = false;
	startSwipeX = 0;

	// возвращаем все на свои места при отмене свайпа	
	viewer.classList.remove("swiping"); // возвращаем плавные переходы
		/*
	layerMid.style.transition = "transform .185s ease-in-out";
	imageMid.style.transition = "opacity .185s ease-in-out, transform .185s ease-in-out";

	layerTop.style.transition = "transform .185s ease-in-out";

	imageBot.style.transition = "opacity .185s ease-in-out, transform .185s ease-in-out";
		*/

	imageMid.style.opacity = `1`;	
	imageMid.style.transform = `scale(1)`;	  
	layerMid.style.transform = `translateX(0) scale(1)`;	  

	layerTop.style.transform = `translateX(-100%)`; // весь слой смещаем
		
	imageBot.style.transform = `scale(0.5)`; // картинку снизу уменьшаем
	imageBot.style.opacity = `0.0`;
  }

	
//удаление поинтеров изза экрана
	function removePointer(e) {
    activePointers.delete(e.pointerId);
}

window.addEventListener("pointerup", removePointer);
window.addEventListener("pointercancel", removePointer);


	// обновление слоев лайтбокса

function updateLayers(index) {

const nextCard = gallery[(index + gallery.length + 1) % gallery.length].card;
const prevCard = gallery[(index + gallery.length - 1) % gallery.length].card;
const nowCard = gallery[index].card;

//viewer.classList.add("swiping");

imageBot.style.transform = `scale(0.5)`; // картинку снизу уменьшаем
imageBot.style.opacity = `0.0`;
imageBot.style.aspectRatio = nextCard.dataset.ratio;
imageBot.style.backgroundImage = `url("${nextCard.dataset.image}")`;
imageBot.dataset.ratio = nextCard.dataset.ratio; // kinda real aspect

layerTop.style.transform = `translateX(-100%)`; // весь слой смещаем
imageTop.style.backgroundImage = `url("${prevCard.dataset.image}")`;
imageTop.style.aspectRatio = prevCard.dataset.ratio;
imageTop.dataset.ratio = prevCard.dataset.ratio; // kinda real aspect


imageMid.style.backgroundImage = `url("${nowCard.dataset.image}")`;
imageMid.style.aspectRatio = nowCard.dataset.ratio;
imageMid.dataset.ratio = nowCard.dataset.ratio; // kinda real aspect

//viewer.classList.remove("swiping"); 
}

  const viewer = document.getElementById("viewer");
  const viewerImage = document.getElementById("viewerImage");
  const viewerWrp = layerMid;

  function openViewer(index){

  	const src = gallery[index].card.dataset.image;
	const aspect = gallery[index].card.dataset.ratio;
		
	  viewer.classList.add("swiping");
	  updateLayers(index);


    
//const vw = window.innerWidth * 0.89;
//const vh = window.innerHeight * 0.89;

//let w = vw;
//let h = w / aspect;

//if (h > vh) {
//    h = vh;
//    w = h * aspect;
//}

//viewerFrame.style.width = w + "px";
//viewerFrame.style.height = h + "px";
//     viewerFrame.style.aspectRatio = aspect;
    
  document.body.classList.add("no-scroll");
  document.documentElement.classList.add("no-scroll");
 
 // viewerImage.style.backgroundImage = `url("${src}")`;
 // viewerImage.style.aspectRatio = aspect;
 //   viewerImage.dataset.ratio = aspect; // kinda real aspect
  viewer.classList.add("open");

function calcVLs() {
    // 1. Находим текущую ширину и высоту всего окна браузера в пикселях
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    // 2. Вычисляем физическую ширину и высоту лимита (89vw и 89vh)
    const width = vw * 0.89;
    const height = vh * 0.89;

    // 3. Вычисляем координаты top и left, чтобы область была строго по центру экрана
    const left = (vw - width) / 2;
    const top = (vh - height) / 2;

    // 4. Возвращаем объект, полностью повторяющий структуру getBoundingClientRect()
    return {
        width: width,
        height: height,
        left: left,
        top: top,
        right: left + width,
        bottom: top + height
    };
}

    width = containerRect.width;

// 4. Формируем финальный объект startRect с теми же свойствами, что у DOMRect
