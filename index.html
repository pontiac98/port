/* лайтбокс          */

.lightbox-nav {
  position: absolute;
  inset: 0;
  z-index: 10; /* Поверх слоев картинок */
  
  /* Флекс-контейнер разносит зоны по краям, оставляя центр пустым */
  display: flex;
  justify-content: space-between;
  align-items: center;
  
  /* Магия: клики сквозь ПУСТОЕ пространство проходят к картинке ниже */
  pointer-events: none; 
	opacity: 1;
	transition: opacity 0.2s ease-in-out;
}
	.lightbox-nav.zoom {
opacity: 0;
	}

	/* Сами интерактивные зоны шириной 10vw */
.lightbox-nav .nav-zone {
	margin: 0 12px 0;
  width: 5vw;
  height: 25%; /* На всю высоту экрана, чтобы легче было попасть */
  display: flex;
  align-items: center;
	justify-content: space-between;
  /*cursor: pointer;  */
  
  /* Возвращаем кликабельность для самих зон */
  pointer-events: auto; 
  
  /* Отключаем выделение текста стрелочек при частых кликах */
  user-select: none;
  -webkit-user-select: none;
	background-color: #ffffff00;

	transition: background-color 0.2s ease-in-out;
}

	/* Стили самих белых стрелок-модификаторов */
.lightbox-nav .nav-arrow {

 display: inline-flex;    /* Превращаем в гибкий контейнер, но сохраняем поведение в строке */
  align-items: center;     /* Ровняем текст и символы строго по ВЕРТИКАЛИ */
 /* justify-content: center;   Ровняем текст и символы строго по ГОРИЗОНТАЛИ */
	justify-content: space-between;
	
  color: #333;
  font-size: 48px; /* Размер тонких уголков */
  font-weight: 300;
  
  /* Изначальная прозрачность 30% */
  opacity: 0.3; 
  
  /* Плавный переход прозрачности */
  transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out;
}

/* ХОВЕР-ЭФФЕКТ: при наведении на ДИВ-ЗОНУ, СПАН-СТРЕЛКА становится 80% прозрачности */
.lightbox-nav .nav-zone:hover .nav-arrow {
  opacity: 0.8;
	transform: translateX(4px);
}

 background-color: #ffffff0f;
}

#viewer {
    position: fixed;
    inset: 0;
  /*  display: flex;
    justify-content: center;
    align-items: center;  */
    isolation: isolate;

    z-index: 1000;

    opacity: 0;
    visibility: hidden; 
    pointer-events: none;

    backdrop-filter: blur(0px);
    transition:
        opacity .1s ease-out,
        visibility .1s ease; 
}

#viewer.open {
    backdrop-filter: blur(0px) grayscale(100%);
    opacity: 1;
    visibility: visible; 
    pointer-events: auto;
}

  #viewer::before {
    content: "";
    position: fixed;
    inset: -20px;
    z-index: -1;

    background: rgba(230,230,230,.85);
    opacity: 0;
    transition: 
		background 1s ease-out,
		opacity .8s ease-out .0s;
    pointer-events: none;
}

#viewer.open::before {
  content: "";
    opacity: 1;
}

	#viewer.open.deep::before {
  content: "";
    background: rgba(230,230,230,1);
}

  /*  test */
  #viewer.open::after {
   /* content: ""; */
    position: fixed;
    inset: -20px;
    z-index: 1;
    background: white;
    opacity: .01;
    pointer-events: none;
}

/* Базовое состояние для текстового блока (изначально скрыт) */
.info-block {
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
  
  /* Размещаем его абсолютно поверх или вместо галереи, чтобы верстка не прыгала */
  position: relative;
  top: 0px; /* Подстройте под высоту вашего сжимающегося меню */
  left: 0px;
  width: 100%;

	overflow: hidden;
    height: 0px;


 /* МЕНЮ ФЛЕКС: Центрируем внутренний враппер awrp по горизонтали */
  display: flex;
  justify-content: center;
  align-items: flex-start; /* Текст начнется сверху и будет расти вниз */
}

/* Когда текстовый блок активен — плавно проявляем его */

	/*display: flex;  Гарантируем флекс-режим при активации */
	height: auto;
	/*min-height: 100vh;  100dvh */
  opacity: 1;
  visibility: visible;
}

.awrp {
	padding: 0 4px;

  max-width: 900px;

/* Адаптивная картинка в бэкграунде */
.aimg {
  width: 100%; /* Картинка занимает всю ширину враппера (900px на ПК) */
  
  /* !!! ВМЕСТО height: 400px ИСПОЛЬЗУЕМ ПРОПОРЦИИ */
  height: auto;               /* Сбрасываем жесткую высоту */
  aspect-ratio: 1080 / 400;   /* Или просто пишите 2.7 / 1 */

	min-height: 250px;


	background-repeat: no-repeat;
  background-image: url('about.png');
  background-size: cover; /* contain Картинка масштабируется без искажений, заполняя блок */
  background-position: center; /* Центрируем изображение внутри блока */
  border-radius: 8px; /* Опционально: аккуратное скругление углов */
  margin: 24px 0; /* Отступ  */
}

.ai-tag {
	display: none; /* Изначально скрываем */

  right: 8px;

  /* Оформление фона и размеров */

  padding: 4px 10px;
  border-radius: 24px; /* Овальная аккуратная плашка (вместо 50% круга, чтобы текст влез) */
  
  /* Стили текста */
  color: #222;
  font-size: 12px;
  font-weight: bold;
 /* text-transform: uppercase; */
  letter-spacing: 0.5px;

	transition:   opacity .155s ease; 
}

// Функция, которая считывает время transition: opacity из CSS и переводит в миллисекунды
function getTransitionDuration(element) {
    const styles = window.getComputedStyle(element);
    
    // Считываем время анимации (строка вида "0.25s" или "250ms")
    const durationStr = styles.transitionDuration || "0s";
    
    // Переводим в число (parseFloat уберет буквы "s" или "ms")
    const duration = parseFloat(durationStr);
    
    // Если время указано в секундах (например, 0.25), умножаем на 1000, чтобы получить миллисекунды
    return durationStr.includes('ms') ? duration : duration * 1000;
}

// Добавляем второй параметр skipFadeOut со значением по умолчанию false

            grid.classList.remove('fade-out');

            // Возвращаем плавность обратно на следующем кадрах для будущих кликов
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    grid.style.transition = '';
					isMenuBlocking = false; 
                });
            });
        }

        // 2. ПРОВЕРКА: Если нам нужно пропустить исчезновение (шли из ABOUT)
        if (skipFadeOut) {
            proceedWithRender(); // Сразу собираем галерею
        } else {
            // Стандартный сценарий: плавно тушим старую галерею, перед показом новой
			grid.classList.remove('fade-out');
            grid.classList.add('fade-out');

function updateSwipe(x) {
//отключаем анимацию только когда происходит свайп
	//viewer.classList.add("swiping");
	
	
	const rF = 0.70; // фактор тяжести
	const deltaSwipeX = (x - startSwipeX) * rF;
	progress = Math.min(1, Math.abs(x - startSwipeX) / innerWidth);


	const scaleF = .33;
	const opaF = .8;
	
	// свайп в лево
	if (deltaSwipeX < 0) {
		const scaleBot = 1 - scaleF + scaleF * progress;
		const opaBot = progress * opaF;

		//вернуть в прежнее слои из правого свайпа

	imageBot.style.transform = `scale(${scaleBot})`;	
	layerMid.style.transform = `translateX(${deltaSwipeX}px)`;	
		
	} else if (deltaSwipeX > 0) {  //  свайп в право
		const scaleMid = 1 - scaleF * progress;
		const opaMid = (1 - progress ) * .75 + .25;
		const shiftX = (-1.01 + progress*rF)*100;

		//вернуть в прежнее слои из левого свайпа
		imageBot.style.opacity = `0`;	
		imageBot.style.transform = `scale(.5)`;	
		layerMid.style.transform = `translateX(0px)`;	

	imageMid.style.opacity = `${opaMid}`;	
	imageMid.style.transform = `scale(${scaleMid})`;
	layerTop.style.transform = `translateX(${shiftX}%)`;	
	}
}

function calcVLs() {
    // 1. Находим текущую ширину и высоту всего окна браузера в пикселях
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    // 2. Вычисляем физическую ширину и высоту лимита (89vw и 89vh)
    const width = vw * 0.89;
    const height = vh * 0.89;

    // 3. Вычисляем координаты top и left, чтобы область была строго по центру экрана
    const left = (vw - width) / 2;
    const top = (vh - height) / 2;

    // 4. Возвращаем объект, полностью повторяющий структуру getBoundingClientRect()
    return {
        width: width,
        height: height,
        left: left,
        top: top,
        right: left + width,
        bottom: top + height
    };
}

    function checkDebugHash() {
        const currentHash = window.location.hash;

        if (currentHash === "#dev") {
            element.style.display = "block";
            console.log("Режим отладки ВКЛЮЧЕН");
            
            // Очищаем хэш, чтобы адресная строка оставалась чистой
            history.replaceState(null, null, window.location.pathname);
        } 
        else if (currentHash === "#hide") {
            element.style.display = "none";
            console.log("Режим отладки ВЫКЛЮЧЕН");
            
            // Очищаем хэш
            history.replaceState(null, null, window.location.pathname);
        }
    }

    // 1. Проверяем хэш сразу при открытии страницы (если перешли по ссылке вида ://site.com)
    checkDebugHash();

    // 2. Отслеживаем изменения хэша НА ЛЕТУ без перезагрузки страницы
    window.addEventListener("hashchange", checkDebugHash);

menu.addEventListener('click', async (e) => {

	isMenuBlocking = true;

        grid.classList.add('fade-out');
        
        // 2. Параллельно начинаем скачивать текст в фоне, чтобы не терять время
        const textPromise = fetch('about').then(res => res.text());

        grid.addEventListener('transitionend', async function onFadeEnd(evt) {
            if (evt.propertyName !== 'opacity') return;

            grid.innerHTML = '';

            const textContainer = document.getElementById("text-container");
            textContainer.innerHTML = '';

            // 2. Получаем чистый текст из вашего текстового файла
            const plainText = await textPromise;

            // 3. Разбиваем текст на массив строк по символу переноса строки (\n)
            // Регулярное выражение /\r?\n/ корректно сработает и на Windows (\r\n), и на Linux/Mac (\n)
            const paragraphs = plainText.split(/\r?\n/);

            // 4. Проходим циклом по всем абзацам
            paragraphs.forEach(paragraphText => {
                 if (paragraphText.trim() === '') return;

                const p = document.createElement('p');
                p.className = 'about-paragraph';

                // РЕГУЛЯРНОЕ ВЫРАЖЕНИЕ: ищет любые последовательности английских букв (A-Z, a-z)
                // Символ \b гарантирует, что мы захватываем слова целиком, включая знаки препинания вокруг
                const englishRegex = /([A-Za-z0-9\-]+)/g;

                // Оборачиваем найденные совпадения в тег span с классом eng
                // $1 — это то самое английское слово, которое нашел JS
                const processedText = paragraphText.replace(englishRegex, '<span class="eng">$1</span>');

                // Используем innerHTML, чтобы браузер превратил строку со спанами в живые теги
                p.innerHTML = processedText;

                textContainer.appendChild(p);
            });







			

            // Мгновенно скроллим в самый верх перед показом текста
            window.scrollTo({ top: 0, behavior: 'auto' });

            aboutBlock.classList.add('active');
			isMenuBlocking = false; // разблокируем меню
