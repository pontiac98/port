<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Designer Portfolio" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Принудительно подключаем ту же адаптивную иконку и стили сайта -->
  <link rel="icon" type="image/svg+xml" href="icon.svg?v=1.1">
	<link rel="preload" href="dotgothic16.woff2" as="font" type="font/woff2" crossorigin>
  
  <style>

	  @font-face {
		   font-display: block; 
  font-family: 'DotGothic16';
  font-style: normal;
  font-weight: 400;
  src: url('dotgothic16.woff2') format('woff2'); /* Chrome 36+, Opera 23+, Firefox 39+, Safari 12+, iOS 10+ */
}
	
@font-face {
  font-display: block; 
  font-family: "M PLUS 1p";
  font-style: normal;
  font-weight: 400;
  src: url('m-plus-1p.woff2') format('woff2'); /* Chrome 36+, Opera 23+, Firefox 39+, Safari 12+, iOS 10+ */
}

html {
  color-scheme: light dark; 
     scrollbar-width: none; /* Для Firefox */
  -ms-overflow-style: none;  /* Для IE и Edge */

	  user-select: none;
  -webkit-user-select: none;

}
	  
    body {

    scrollbar-width: none; /* Для Firefox */
  -ms-overflow-style: none;  /* Для IE и Edge */
    
    position: relative;
    margin: 0px;
    padding: 0px;
    background: #EEE;

  font-family: "DotGothic16", sans-serif;
  font-weight: 400;
  font-style: normal; 
  }

	  .page-wrapper {
		display: flex;
		  flex-direction: column;
    align-items: center;
    justify-content: center;
	  }

	  .message {
		  flex-grow: 1;
	  }
 .message-null {
		  flex-grow: .13;
	  }
	  
    
    /* Стили специально для сообщения об ошибке */
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 100vh; /* Занимает половину высоты экрана */
      /*padding: 20px;  */
    }
    
    .error-code {
      font-family: 'DotGothic16', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: #333;
      line-height: 1;
      margin: 0;
      opacity: 0.15; /* Делаем цифры изящно блеклыми, в стиле минимализма */
    }
    
    .error-title {
      font-family: 'M PLUS 1p', sans-serif;
      font-size: 16px;
		color: #333;
      margin: 20px 0 10px 0;
		opacity: .8;
    }
    
    .error-link {
      font-family: 'DotGothic16', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #333;
      text-decoration: none;
      padding-bottom: 2px;
      margin-top: 30px;
      letter-spacing: 0.6px;
    }
    
    .error-link:hover {
      opacity: 0.6;
		font-weight: 400;
    }

@media (prefers-color-scheme: dark) {
	html, body {
background: #333;
	}
 .error-link {
   color: silver;
 }
   .error-link:hover {
       font-weight: 400;
    }
  .error-code {
    color: silver;
  }
}

    
  </style>
</head>
<body>

  <!-- Наша проверенная флекс-обертка, которая прижмет футер к низу экрана при любом масштабе -->
  <div class="page-wrapper">



    <!-- Главный блок с ошибкой, который благодаря flex-grow займет всё свободное место -->
    <div class="message">
      <div class="error-container">
        <h1 class="error-code">404</h1>
        <p class="error-title">Такой страницы нет</p>
        <a href="index.html" class="error-link">＋back to main page</a>
      </div>
    </div>

	  <div class="message-null"></div>

  </div>

</body>
</html>
